<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06121f"/>
      <stop offset="100%" stop-color="#0d2b4f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <path d="M256 64 L384 112 V232 C384 326 329 405 256 448 C183 405 128 326 128 232 V112 Z"
        fill="none" stroke="url(#shield)" stroke-width="28" filter="url(#glow)" stroke-linejoin="round"/>

  <circle cx="256" cy="230" r="82" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="18"/>
  <path d="M190 230 H322 M256 164 V296" stroke="#a3e635" stroke-width="22" stroke-linecap="round"/>

  <text x="256" y="382"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="84"
        font-weight="800"
        fill="#ffffff"
        letter-spacing="4">IP</text>
</svg>
