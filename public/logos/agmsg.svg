<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <!-- Background gradient definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D966;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C9A7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Full chat window - rounded rectangle -->
  <rect x="3" y="3" width="42" height="42" rx="6" ry="6" fill="url(#grad1)" stroke="none"/>
  
  <!-- Inner dark space for chat content -->
  <rect x="6" y="6" width="36" height="36" rx="4" ry="4" fill="#050810" stroke="none"/>
  
  <!-- Message lines to suggest chat -->
  <line x1="11" y1="12" x2="30" y2="12" stroke="#00D966" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="11" y1="18" x2="35" y2="18" stroke="#00C9A7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="11" y1="24" x2="28" y2="24" stroke="#00D966" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Second message set -->
  <line x1="18" y1="31" x2="37" y2="31" stroke="#00C9A7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="18" y1="37" x2="32" y2="37" stroke="#00D966" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
