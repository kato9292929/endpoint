<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Subtle Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Market Grid Lines (Subtle) -->
  <path d="M 96 160 H 416 M 96 256 H 416 M 96 352 H 416" stroke="#1E293B" stroke-width="8" stroke-dasharray="16 16" />

  <!-- The "X" + Upward Market Trend Icon -->
  <g filter="url(#glow)">
    <!-- Descending Arm of the X -->
    <path d="M 140 140 L 372 372" stroke="#334155" stroke-width="54" stroke-linecap="round" />

    <!-- Ascending Dynamic Market Trend Line (Crossing to complete X) -->
    <path d="M 140 372 L 240 272 L 310 320 L 372 140"
          stroke="url(#accentGrad)"
          stroke-width="54"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none" />

    <!-- Arrow/Trend Point at Top Right -->
    <circle cx="372" cy="140" r="16" fill="#67E8F9" />
  </g>
</svg>
