name: Daily directory fetch

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch directories
        run: npm run fetch
        env:
          # Raises the GitHub API rate limit for the Pay.sh (pay-skills) fetcher.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write stats snapshot
        run: node scripts/write-stats-snapshot.mjs

      - name: Commit updated catalog and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/endpoints.json data/stats
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily directory fetch ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Report failure
        if: failure()
        run: echo "::error::Daily fetch/snapshot job failed — catalog or stats snapshot was not updated."
