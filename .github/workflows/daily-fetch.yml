name: Daily directory fetch

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch directories
        run: npm run fetch
        env:
          # Raises the GitHub API rate limit for the Pay.sh (pay-skills) fetcher.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch ranking (x402scan most-called)
        run: npm run fetch:rank

      - name: Write stats snapshot
        run: node scripts/write-stats-snapshot.mjs

      - name: Commit updated catalog and snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/endpoints.json data/stats data/rank.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily directory fetch ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The site bakes data/endpoints.json in at build time, so the front only
      # updates on a fresh deploy. Force a Vercel production rebuild when data
      # changed. No-ops unless the VERCEL_DEPLOY_HOOK secret is set, so Git
      # auto-deploy remains the path if you prefer it.
      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK not set — relying on Vercel Git auto-deploy."
            exit 0
          fi
          echo "Triggering Vercel deploy hook…"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
          echo "Deploy hook responded HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Vercel deploy hook failed (HTTP $code)."
            exit 1
          fi

      - name: Report failure
        if: failure()
        run: echo "::error::Daily fetch/snapshot job failed — catalog or stats snapshot was not updated."
